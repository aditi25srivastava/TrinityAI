version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: trinity
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trinity_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  qdrant_data:
  postgres_data:
